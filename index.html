<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Newsletter Growth Copilot</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}input{width:100%;padding:.5rem}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px;margin-top:.5rem}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>📬 Newsletter Growth Copilot</h1><p>Score a subject line for open-rate potential.</p><input id="s" placeholder="Subject line..."><button onclick="go()">Score</button><div id="out"></div><script>function go(){const s=document.getElementById('s').value;let sc=50,tips=[];if(s.length>20&&s.length<60){sc+=15}else tips.push('Keep 20-60 chars');if(/\?|how|why/i.test(s)){sc+=10}else tips.push('Questions drive curiosity');if(/you|your/i.test(s)){sc+=10}else tips.push('Personalize with "you/your"');if(/free|sale|%%%/i.test(s)){sc-=20;tips.push('Spam-trigger words detected')}else{sc+=5}if(/\d/.test(s)){sc+=5}else tips.push('Numbers boost opens');document.getElementById('out').textContent=`Open-rate score: ${sc}/100\n\nTips:\n${tips.length?tips.map(t=>'• '+t).join('\n'):'• Great subject line!'}\n\nFull growth stack (A/B, send-time, churn): commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/newsletter-growth-copilot">GitHub</a> · <a href="https://ziontechgroup.com/zion-ai-email-marketing-pro/">Email Marketing Pro</a></p></body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Newsletter Growth Copilot</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}input{width:100%;padding:.5rem;margin:.3rem 0}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>📰 Newsletter Growth Copilot</h1><p>Score your subject line.</p><input id="s" placeholder="Subject line..."><button onclick="go()">Score</button><div id="out"></div><script>function go(){const s=document.getElementById('s').value;let sc=50,t=[];if(s.length>20&&s.length<60)sc+=15;else t.push('Keep 20-60 chars');if(/\?/.test(s))sc+=10;else t.push('Questions boost opens');if(/\d/.test(s))sc+=10;else t.push('Numbers attract clicks');if(/you|your/i.test(s))sc+=10;else t.push('Personalize ("you")');if(/free|guarantee|100%/i.test(s)){sc-=15;t.push('Spam-trigger words detected')}document.getElementById('out').textContent=`Score: ${Math.min(100,sc)}/100\n${t.length?'Tips:\n'+t.map(x=>'• '+x).join('\n'):'Great subject line!'}\n\nFull growth automation: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/newsletter-growth-copilot">GitHub</a> · <a href="https://ziontechgroup.com/referral-engine-ai/">Referral Engine</a></p></body></html>
